<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Slow Sunday Morning">
<title>Slow Sunday Morning</title>
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .5  0 0 0 0 .4  0 0 0 0 .3  0 0 0 .07 0"/>
  </filter>
    <linearGradient id="s-wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf4ea"/><stop offset="1" stop-color="#efe3d3"/></linearGradient>
    <linearGradient id="s-beam" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3d6" stop-opacity=".85"/><stop offset="1" stop-color="#fff3d6" stop-opacity="0"/></linearGradient>
    <linearGradient id="s-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe4ee"/><stop offset="1" stop-color="#f7ebd6"/></linearGradient></defs>

  <rect width="1200" height="800" fill="url(#s-wall)"/>
  <rect y="640" width="1200" height="160" fill="#d9bf9d"/>
  <!-- window + linen curtains -->
  <rect x="80" y="70" width="330" height="420" fill="url(#s-sky)"/>
  <path d="M 60 50 C 90 200 70 360 110 520 L 190 520 C 170 360 180 200 170 50 Z" fill="#fffaf2" opacity=".93">
    <animate attributeName="d" values="M 60 50 C 90 200 70 360 110 520 L 190 520 C 170 360 180 200 170 50 Z;M 60 50 C 96 200 80 360 122 520 L 196 520 C 176 360 186 200 170 50 Z;M 60 50 C 90 200 70 360 110 520 L 190 520 C 170 360 180 200 170 50 Z" dur="7s" repeatCount="indefinite"/>
  </path>
  <path d="M 430 50 C 400 200 420 360 380 520 L 300 520 C 320 360 310 200 320 50 Z" fill="#fffaf2" opacity=".9"/>
  <rect x="50" y="44" width="400" height="10" rx="5" fill="#c9b08f"/>
  <!-- sunbeams -->
  <path d="M 200 120 L 330 120 L 980 720 L 640 720 Z" fill="url(#s-beam)" opacity=".7">
    <animate attributeName="opacity" values=".7;.5;.7" dur="8s" repeatCount="indefinite"/>
  </path>
  <path d="M 340 160 L 400 160 L 1140 700 L 1000 700 Z" fill="url(#s-beam)" opacity=".5"/>
  <!-- plant -->
  <path d="M 1080 640 L 1060 560 L 1140 560 L 1120 640 Z" fill="#c9805e"/>
  <path d="M 1100 560 C 1060 500 1040 470 1050 420 C 1080 460 1096 500 1100 560 Z M 1100 560 C 1110 490 1140 450 1170 440 C 1160 490 1130 520 1100 560 Z M 1100 560 C 1090 500 1100 440 1120 400 C 1130 460 1116 510 1100 560 Z" fill="#7f9b6e"/>
  <!-- bed -->
  <rect x="470" y="300" width="560" height="160" rx="22" fill="#d8c0a0"/>
  <rect x="470" y="300" width="560" height="28" rx="14" fill="#c6aa86"/>
  <rect x="440" y="460" width="620" height="190" rx="30" fill="#fdfaf5"/>
  <ellipse cx="610" cy="430" rx="110" ry="54" fill="#ffffff"/>
  <ellipse cx="760" cy="420" rx="100" ry="50" fill="#f6efe4"/>
  <ellipse cx="560" cy="452" rx="90" ry="46" fill="#f9f3ea"/>
  <rect x="460" y="640" width="24" height="40" fill="#b08f6c"/><rect x="1016" y="640" width="24" height="40" fill="#b08f6c"/>
  
  <g transform="translate(610 520) scale(1 1)">
    <!-- legs -->
    <path d="M -40 -6 C 10 -30 90 -36 150 -24 C 175 -18 182 12 160 22 C 110 34 30 30 -36 26 Z" fill="#bcd0dd"/>
    
    <path d="M -70 0 C 30 -30 210 -36 440 -20 L 450 120 L -160 120 Z" fill="#ffffff"/><path d="M -10 40 C 70 20 150 28 210 40 M 90 80 C 190 66 290 70 370 80" stroke="#ece3d6" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- far arm -->
    <path d="M 18 -132 C 40 -100 52 -70 70 -52" stroke="#a0b6c6" stroke-width="26" stroke-linecap="round" fill="none"/>
    <!-- torso -->
    <path d="M -52 4 C -66 -50 -58 -112 -26 -146 C -4 -166 32 -164 48 -142 C 62 -112 62 -54 58 0 Z" fill="#bcd0dd"/>
    <path d="M -52 4 C -64 -48 -58 -100 -36 -134 C -46 -96 -48 -48 -36 4 Z" fill="#a0b6c6" opacity=".55"/>
    
    <!-- album -->
    <g transform="translate(108 -40) rotate(-8)">
      <path d="M -62 -6 L 0 -16 L 64 -6 L 66 30 L 0 22 L -64 30 Z" fill="#7a4a35"/>
      <path d="M -58 -8 L -2 -16 L -2 18 L -60 24 Z" fill="#fbf4e8"/>
      <path d="M 2 -16 L 60 -8 L 62 24 L 2 18 Z" fill="#f6eddd"/>
      <rect x="-50" y="-6" width="20" height="16" fill="#e9a87c" transform="skewY(-8)"/>
      <rect x="-26" y="-9" width="18" height="22" fill="#9bb7c9" transform="skewY(-8)"/>
      <rect x="10" y="-12" width="22" height="16" fill="#c9a3b5" transform="skewY(8)"/>
      <rect x="36" y="-8" width="16" height="18" fill="#a9c29a" transform="skewY(8)"/>
      <path d="M 0 -16 L 0 22" stroke="#d8c7ad" stroke-width="2"/>
    </g>
    <!-- near arm -->
    <path d="M 26 -128 C 30 -86 40 -60 78 -44" stroke="#bcd0dd" stroke-width="30" stroke-linecap="round" fill="none"/>
    <ellipse cx="86" cy="-42" rx="11" ry="9" fill="#f1c6a2"/>
    <ellipse cx="128" cy="-50" rx="9" ry="8" fill="#e3ae88"/>
    <!-- neck and head, tilted down toward the album -->
    <rect x="2" y="-176" width="20" height="30" rx="8" fill="#e3ae88"/>
    <g transform="rotate(18 12 -180)">
      <circle cx="16" cy="-196" r="33" fill="#f1c6a2"/>
      <ellipse cx="34" cy="-184" rx="8" ry="5" fill="#eaa18a" opacity=".55"/>
      <path d="M 30 -198 q 6 4 12 0" stroke="#5a3b2e" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <path d="M 36 -176 q 5 3 9 -1" stroke="#a9614e" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <path d="M -18 -186 C -24 -220 2 -240 30 -232 C 48 -226 54 -214 50 -204 C 36 -214 20 -214 8 -206 C 0 -196 -2 -180 -10 -164 C -16 -170 -18 -178 -18 -186 Z" fill="#4a3226"/>
      <circle cx="-14" cy="-226" r="15" fill="#4a3226"/>
    </g>
  </g>
  <!-- cat, curled, breathing -->
  <g transform="translate(940 500)">
    <g>
      <ellipse cx="0" cy="0" rx="62" ry="34" fill="#e7a35e"/>
      <path d="M -46 -10 C -60 20 -10 40 40 28 C 10 30 -30 20 -46 -10 Z" fill="#d38946"/>
      <circle cx="44" cy="-14" r="24" fill="#e7a35e"/>
      <path d="M 30 -32 L 34 -50 L 46 -36 Z M 50 -34 L 62 -48 L 64 -28 Z" fill="#e7a35e"/>
      <path d="M 38 -14 q 4 3 8 0 M 52 -14 q 4 3 8 0" stroke="#5b3a22" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M -50 10 C -70 30 -20 44 20 34" stroke="#d38946" stroke-width="12" fill="none" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="scale" values="1 1;1.02 1.05;1 1" dur="3.4s" repeatCount="indefinite"/>
    </g>
  </g>
  <!-- nightstand + coffee -->
  <rect x="300" y="500" width="130" height="150" rx="8" fill="#c7a682"/>
  <rect x="314" y="540" width="102" height="4" fill="#ad8b66"/>
  <rect x="290" y="490" width="150" height="16" rx="6" fill="#b8956f"/>
  
  <g transform="translate(350 444)">
    <path d="M 22 8 q 16 0 16 14 q 0 14 -16 14" stroke="#ffffff" stroke-width="6" fill="none"/>
    <path d="M -22 0 L 24 0 L 20 44 Q 0 50 -18 44 Z" fill="#ffffff"/>
    <ellipse cx="1" cy="1" rx="23" ry="5" fill="#7a4d33"/>
  </g>
  <path d="M 342 438 c -8 -12 8 -20 0 -32 c -8 -12 8 -20 0 -32" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0">
    <animate attributeName="opacity" values="0;.55;0" dur="3.6s" begin="0s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 6;0 -14" dur="3.6s" begin="0s" repeatCount="indefinite"/>
  </path>
  <path d="M 350 438 c -8 -12 8 -20 0 -32 c -8 -12 8 -20 0 -32" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0">
    <animate attributeName="opacity" values="0;.55;0" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 6;0 -14" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
  </path>
  <path d="M 358 438 c -8 -12 8 -20 0 -32 c -8 -12 8 -20 0 -32" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0">
    <animate attributeName="opacity" values="0;.55;0" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 6;0 -14" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
  </path>
  <rect x="384" y="470" width="40" height="22" rx="3" fill="#9bb7c9"/><rect x="380" y="458" width="44" height="14" rx="3" fill="#e9a87c"/>
<rect width="1200" height="800" filter="url(#grain)"/>
</svg>
